<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – Medicaps</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); margin: 0; }
    .login-box { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: var(--shadow-lg); width: 100%; max-width: 350px; text-align: center; }
    .logo-icon { font-size: 40px; margin-bottom: 10px; }
    .input-field { width: 100%; padding: 12px; margin: 10px 0 15px 0; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Outfit'; font-size: 14px; box-sizing: border-box; }
    .input-field:focus { outline: none; border-color: var(--orange); }
    .btn-primary { width: 100%; padding: 12px; background: var(--navy); color: white; border: none; border-radius: 10px; font-family: 'Outfit'; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--navy-light); }
    .status-msg { padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
    .error { background: #fee2e2; color: #dc2626; display: block; }
    .success { background: #dcfce7; color: #16a34a; display: block; }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo-icon">🎓</div>
  <h2 style="color: var(--navy); margin: 0 0 5px 0;">Create Account</h2>
  <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Join Campus Navigation</p>

  <div id="statusMsg" class="status-msg"></div>

  <input type="text" id="name" class="input-field" placeholder="Full Name (e.g. Rahul Kumar)">
  <input type="email" id="email" class="input-field" placeholder="Student Email">
  <input type="password" id="password" class="input-field" placeholder="Create Password">
  
  <button class="btn-primary" onclick="studentSignup()">Sign Up →</button>

  <div style="margin-top: 15px; font-size: 13px;">
    <span style="color: var(--text-muted);">Already have an account?</span>
    <a href="login.html" style="color: var(--orange); font-weight: 600; text-decoration: none;">Login here</a>
  </div>
</div>

<script>
  function studentSignup() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const msgBox = document.getElementById('statusMsg');

    if (!name || !email || !password) {
      msgBox.className = 'status-msg error';
      msgBox.textContent = 'Please fill all fields!';
      return;
    }

    fetch('http://127.0.0.1:5000/api/user/signup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, password: password })
    }).then(r => r.json()).then(d => {
      if (d.success) {
        msgBox.className = 'status-msg success';
        msgBox.textContent = '✅ Account created! Redirecting to login...';
        
        // 2 second baad login page par le jao
        setTimeout(() => window.location.href = 'login.html', 2000);
      } else {
        msgBox.className = 'status-msg error';
        msgBox.textContent = d.message || 'Something went wrong!';
      }
    }).catch(() => {
        msgBox.className = 'status-msg error';
        msgBox.textContent = 'Server error! Is App.py running?';
    });
  }
</script>
</body>
</html>
