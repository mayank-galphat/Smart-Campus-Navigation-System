<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Campus Navigation – Medicaps University</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>
<script>
  // Agar user logged in nahi hai, toh wapas login page par bhej do
  if (localStorage.getItem('studentLoggedIn') !== 'true') {
    window.location.href = 'login.html';
  }
</script>
<header>
  <div class="header-inner">
    <div class="header-logo">📍</div>
    <div class="header-text">
      <h1>Smart Campus Navigation</h1>
      <p>Medicaps University, Indore</p>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
        <div class="header-badge">LIVE MAP</div>
        
        <a href="faculty_dashboard.html" style="color: white; font-size: 12px; font-weight: 600; text-decoration: none; border: 1.5px solid rgba(255,255,255,0.3); padding: 4px 12px; border-radius: 20px; transition: 0.2s;">Faculty Login</a>
        <button onclick="logoutStudent()" style="background: none; color: #ff6b18; border: none; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 10px;">Logout</button>
    </div>
  </div>
  
</header>

<div class="main-container">

  <div class="search-wrapper">
    <div class="search-bar">
      <div class="search-icon">🔍</div>
      <input type="text" id="searchInput" placeholder="Search blocks, canteen, library, hostels...">
    </div>
    <div id="suggestions"></div>
  </div>

  <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
    <button onclick="openFacultyModal()" style="background: #0f1b35; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-family: 'Outfit'; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(15,27,53,0.15);">
      👨‍🏫 Find Faculty
    </button>
  </div>

  <div id="map" style="height:500px;width:100%;border-radius:16px;border:1.5px solid #e2e8f0;box-shadow:0 4px 24px rgba(15,27,53,0.08);"></div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon">🏫</div>
      <div class="stat-num">11</div>
      <div class="stat-label">Academic Blocks</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📍</div>
      <div class="stat-num">19</div>
      <div class="stat-label">Total Locations</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🏠</div>
      <div class="stat-num">2</div>
      <div class="stat-label">Hostels</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📚</div>
      <div class="stat-num">1</div>
      <div class="stat-label">Main Library</div>
    </div>
  </div>

</div>

<div id="facultyModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>👨‍🏫 Faculty Directory</h2>
      <button class="close-btn" onclick="closeFacultyModal()">✕</button>
    </div>
    <div id="facultyList" class="faculty-list-container">
      <p style="text-align: center; color: #64748b;">Loading...</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>
<script src="admin.js"></script>
<script>
  function logoutStudent() {
    localStorage.removeItem('studentLoggedIn');
    localStorage.removeItem('studentName');
    window.location.href = 'login.html';
  }
</script>

</body>
</html>
